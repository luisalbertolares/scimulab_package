[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scimulib"
version = "0.1.0"
description = "A Python package for post-processing ab initio calculation results of nanoparticle models, surfaces, and supported nanoparticle systems."
authors = [{name = "Luis Alberto Lares Rangel", email="luis.lares@icat.unam.mx"}, 
{name = "Ana Elizabeth Torres Hernández", email="ana.torres@icat.unam.mx"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.4"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}